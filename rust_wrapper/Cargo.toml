# Experimental / demoted: NOT used by default `oka build apk`.
# Default packaging is the no-Gradle Java embedding + Android SDK tools path.
# This crate is kept for optional NativeActivity experiments only.
# Do not run cargo-apk metadata generators against this file from the CLI.

[package]
name = "flutter_wrapper"
version = "0.1.0"
edition = "2021"
description = "Optional experimental Rust Flutter host (demoted; unused by default oka builds)"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ndk = "0.8"
ndk-sys = "0.5"
log = "0.4"
android_logger = "0.13"

[build-dependencies]
serde_json = "1.0"
