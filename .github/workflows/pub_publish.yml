name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pub-dev-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Assert release tag matches VERSION
        if: github.event_name == 'push'
        run: |
          tag="${{ github.ref_name }}"
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${tag#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "FAIL: tag ($tag) does not match VERSION ($version)" >&2
            exit 1
          fi
          bash tool/release/check_version_sync.sh

      - run: dart pub get

      - name: Publish (dry-run preflight)
        run: dart publish --dry-run

      - name: Publish
        if: github.event_name == 'push'
        run: dart publish --force
