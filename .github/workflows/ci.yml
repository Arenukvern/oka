name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # --no-example: example/ is a Flutter app; plain-dart resolution of it
      # fails (flutter_test is sdk-sourced). Dart >= 3.13 resolves example/
      # by default. The root suite (ADR conformance + real-pipeline evidence)
      # skips gracefully without the Flutter/Android SDKs.
      - run: dart pub get --no-example
      - run: dart analyze --fatal-infos
      - name: Hosted harness compat (pub flutter_mcp_harness + path oka)
        run: |
          cd packages/oka_harness/tool/hosted_compat_analyze
          dart pub get
          dart analyze --fatal-infos lib
      - name: Root test suite (cross-package conformance)
        run: dart test
      - name: Package test suites
        env:
          # Real-R8 shrinking fixture: CI has javac; allow provisioning the
          # Google Maven R8 jar so the release-shrink evidence runs on CI.
          OKA_R8_FIXTURE_ALLOW_DOWNLOAD: '1'
        run: |
          failed=0
          for pkg in packages/*/; do
            if [ -d "$pkg/test" ]; then
              echo "=== $pkg"
              if [ "$pkg" = "packages/oka_dart_kernel/" ]; then
                # Long-lived adversarial suites can exhaust the test runner VM on
                # ubuntu-latest; one dart test per file keeps loads independent.
                if ! (cd "$pkg" && for f in test/*_test.dart; do dart test "$f"; done); then
                  failed=1
                fi
              else
                if ! (cd "$pkg" && dart test); then
                  failed=1
                fi
              fi
            fi
          done
          exit $failed

  windows-session-observation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --no-example
      - name: Verify Windows process identity probes
        run: dart test packages/oka_core/test/process_liveness_windows_test.dart
      - name: Verify Windows AVD inventory workflow
        run: dart test packages/oka_android/test/avd_session_state_test.dart
      - name: Verify Windows managed directory provisioning
        run: dart test packages/oka_core/test/session_state_test.dart --plain-name "creates a managed directory on Windows without chmod"
      - name: Verify Windows Chrome managed profile launch setup
        run: dart test packages/oka_web/test/chrome_session_target_test.dart --plain-name "Windows Chrome managed profile acquisition and launch setup"
      - name: Verify Windows Chrome first-launch safety boundary
        run: dart test packages/oka_web/test/chrome_profile_state_test.dart --plain-name "Windows permits only the first launch of a new profile without a lock"
      - name: Verify Windows host boot identity
        run: dart test packages/oka_core/test/session_state_test.dart --plain-name "records a Windows boot identity when running on Windows"
      - name: Verify Windows state cleanup remains fail-closed
        run: dart test packages/oka_core/test/session_state_test.dart --plain-name "keeps directory cleanup report-only on Windows"

  android-real-smoke:
    # This is the acceptance path for the Phase 0 no-Gradle invariant. It
    # deliberately invokes the repository's Dart pipeline test, never
    # `flutter build apk` or Gradle.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the Android SDK repository, but remains
          # the action's default package list.
          packages: 'platform-tools'
      - name: Install Android build tools required by oka
        run: sdkmanager --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare Flutter Android artifacts
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter doctor -v
      - name: Resolve workspace packages
        run: dart pub get --no-example
      - name: Real no-Gradle APK and AAB smoke
        env:
          OKA_REQUIRE_REAL_ANDROID_SMOKE: 'true'
        run: dart test test/adr0011_apk_contents_test.dart

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Contract gates (version sync, docs drift, changelog hygiene)
        env:
          OKA_ROOT: ${{ github.workspace }}
        run: bash tool/contracts/check_contracts.sh

  validate:
    # pub.dev dry-run for every publishable package (the workspace root is
    # publish_to: none). Runs on PRs touching packaging.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --no-example
      - name: Standalone staged package consumer
        run: bash tool/ci/check_package_consumer.sh
      - name: Publish dry-runs
        run: |
          set -e
          for pkg in packages/*/; do
            if [ -f "$pkg/pubspec.yaml" ] && ! grep -q "publish_to: none" "$pkg/pubspec.yaml"; then
              echo "=== $pkg"
              (cd "$pkg" && dart pub publish --dry-run)
            fi
          done

  linux-desktop-dev:
    # L0: Flutter Linux desktop JIT dev under `oka run dev` (not plain VM).
    # Proves reload/restart/assets on ubuntu-amd64 only — not all Linux hosts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libgtk-3-dev libstdc++-14-dev pkg-config xvfb
      - name: Enable Flutter linux desktop
        run: |
          flutter config --no-analytics --enable-linux-desktop
          flutter pub get
          (cd example && flutter pub get)
          flutter doctor -v
          uname -m
      - run: dart pub get --no-example
      - name: Warm Linux debug bundle (CI cold-start)
        env:
          OKA_LINUX_DEV_GATE_USE_XVFB: '1'
        run: (cd example && xvfb-run -a flutter build linux --debug)
      - name: Public oka run dev routing (outside repo cwd, no OKA_KERNEL_ROOT)
        run: |
          unset OKA_KERNEL_ROOT
          cd /tmp
          log=$(dart "$GITHUB_WORKSPACE/packages/oka/bin/oka.dart" run dev \
            --project "$GITHUB_WORKSPACE/example" \
            --platform linux --no-watch --help 2>&1) || true
          echo "$log" | head -20
          echo "$log" | grep -qv 'experimental live-update stack is not available'
      - name: Linux L0 dev convergence gate (public CLI path)
        env:
          OKA_LINUX_DEV_GATE_USE_XVFB: '1'
          OKA_LINUX_DEV_GATE_CWD: /tmp
        run: bash packages/oka_dart_kernel/tool/gate_linux_dev_convergence.sh
