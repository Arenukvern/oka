name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # --no-example: example/ is a Flutter app; plain-dart resolution of it
      # fails (flutter_test is sdk-sourced). Dart >= 3.13 resolves example/
      # by default. The root test suite skips gracefully without the
      # Flutter/Android SDKs (the determinism_test skip pattern).
      - run: dart pub get --no-example
      - run: dart analyze --fatal-infos
      - run: dart test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Contract gates (version sync, docs drift, changelog hygiene)
        env:
          OKA_ROOT: ${{ github.workspace }}
        run: bash tool/contracts/check_contracts.sh

  validate:
    # pub.dev dry-run; requires a resolvable package. Runs on PRs touching packaging.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --no-example
      # The root package archive includes packages/ (workspace members);
      # the synthetic Play test key is flagged by pub's leak detector and
      # allow-listed via false_secrets in pubspec.yaml.
      - run: dart pub publish --dry-run
