name: oka
description: >-
  No-Gradle build system for Flutter Android. Runs `flutter assemble` with
  direct Android SDK tools (aapt2, d8, apksigner) — no Gradle daemon — with
  plugin packaging, AAB support, and dependency recovery.
version: 0.13.0 # x-release-please-version
homepage: https://github.com/Arenukvern/oka
repository: https://github.com/Arenukvern/oka/tree/main/packages/oka
issue_tracker: https://github.com/Arenukvern/oka/issues
documentation: https://docs.page/arenukvern/oka
topics:
  - flutter
  - android
  - build-system
  - cli
  - gradle

resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  args: ^2.5.0
  from_json_to_json: ^0.6.0
  is_dart_empty_or_not: ^0.6.0
  oka_android: ^0.14.0 # x-release-please-version
  oka_artifacts: ^0.13.0 # x-release-please-version
  oka_core: ^0.15.0 # x-release-please-version
  oka_supervisor: ^0.13.0 # x-release-please-version
  oka_web: ^0.14.0 # x-release-please-version
  path: ^1.9.0
  resource_composition: ^0.13.0 # x-release-please-version
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0

executables:
  oka:
