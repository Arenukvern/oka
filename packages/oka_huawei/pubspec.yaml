name: oka_huawei
description: >-
  The Huawei DEVICE platform package for oka (ADR-0055/0056): the
  GMS-excluding Android build composition (HuaweiBuildVariant) validated at
  composition time. Stores are separate packages — the AppGallery channel
  lives in oka_app_gallery, RuStore in oka_rustore.
version: 0.14.0 # x-release-please-version
homepage: https://github.com/Arenukvern/oka
repository: https://github.com/Arenukvern/oka/tree/main/packages/oka_huawei
issue_tracker: https://github.com/Arenukvern/oka/issues
documentation: https://docs.page/arenukvern/oka
topics:
  - build-system
  - huawei
  - pipeline
  - flutter

resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  meta: ^1.14.0
  oka_android: ^0.14.0 # x-release-please-version
  oka_core: ^0.15.0 # x-release-please-version
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
