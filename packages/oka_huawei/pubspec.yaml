name: oka_huawei
description: >-
  Huawei AppGallery Connect distribution target for oka (ADR-0014 P2):
  HuaweiPublishTarget with a dry-run publish plan, AppGallery Connect REST
  upload tail over an injectable HTTP transport, and a GMS-excluding
  AndroidBuild variant validated at composition time.
version: 1.0.0 # x-release-please-version
homepage: https://github.com/Arenukvern/oka
repository: https://github.com/Arenukvern/oka/tree/main/packages/oka_huawei
issue_tracker: https://github.com/Arenukvern/oka/issues
documentation: https://docs.page/arenukvern/oka
topics:
  - build-system
  - huawei
  - appgallery
  - pipeline
  - flutter

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9
  http: ^1.2.1
  meta: ^1.14.0
  oka_android: ^1.0.0 # x-release-please-version
  oka_core: ^1.0.0 # x-release-please-version
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  oka_conformance: ^1.0.0 # x-release-please-version
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
