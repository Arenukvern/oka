name: oka_web
description: >-
  Web shell station for oka (ADR-0016): typed shell composition
  (WebShellContribution), replaceable emitters (generate + inject), and
  web-shell / web-build targets. Web is explicitly NOT a PlatformPipeline.
version: 0.1.0
homepage: https://github.com/Arenukvern/oka
repository: https://github.com/Arenukvern/oka/tree/main/packages/oka_web
issue_tracker: https://github.com/Arenukvern/oka/issues
documentation: https://docs.page/arenukvern/oka
topics:
  - build-system
  - cli
  - flutter

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9
  meta: ^1.14.0
  oka_core: ^0.1.6
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  # The conformance suite every publish target must pass in tests.
  oka_conformance: ^0.1.6
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
