name: oka_harness
description: >-
  Device E2E targets over oka's owning dev sessions (ADR-0026): launch an
  Android app via `oka dev`, pick the forwarded VM service URI up from the
  runner-session contract, and drive/assert it with the
  flutter_mcp_harness scenario core.
version: 0.6.0 # x-release-please-version
homepage: https://github.com/Arenukvern/oka
repository: https://github.com/Arenukvern/oka/tree/main/packages/oka_harness
issue_tracker: https://github.com/Arenukvern/oka/issues
documentation: https://docs.page/arenukvern/oka
topics:
  - build-system
  - cli
  - testing
  - e2e

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter_mcp_harness: ^7.0.0
  oka_android: ^0.6.0 # x-release-please-version
  path: ^1.9.0
  resource_composition: ^0.6.0 # x-release-please-version
  universal_automation_interface: ^0.2.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
