dependencies:
  crypto: ^3.0.0
  cryptography: ^2.9.0
  from_json_to_json: ^0.6.0
  universal_automation_interface: ^0.4.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
