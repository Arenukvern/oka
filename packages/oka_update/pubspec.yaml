name: oka_update
description: >-
  Authoring and planner surface for declarative patch units (ADR-0031):
  unit specs, revision manifests, and computed patch eligibility. The
  kernel-graph machinery lives in oka_dart_kernel (ADR-0032). Experimental;
  not published.
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.0
  cryptography: ^2.9.0
  universal_automation_interface: ^0.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
