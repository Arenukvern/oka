name: oka_service
description: >-
  Non-GUI buildables for oka (ADR-0055): a generic command pipeline driving
  `jaspr build` / `dart compile exe` / `docker build` / any argv sequence,
  plus a GitHub Releases publish channel. Tiny, framework-agnostic.
version: 0.12.1 # x-release-please-version
homepage: https://github.com/Arenukvern/oka
repository: https://github.com/Arenukvern/oka/tree/main/packages/oka_service
issue_tracker: https://github.com/Arenukvern/oka/issues
documentation: https://docs.page/arenukvern/oka
topics:
  - build-system
  - cli
  - dart

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.14.0
  oka_core: ^0.14.0 # x-release-please-version
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
