documentation: https://docs.page/arenukvern/oka
topics:
  - build-system
  - configuration
  - dart

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.14.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
