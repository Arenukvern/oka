name: oka_dart_kernel
description: >-
  Kernel-graph experiments and gates for ADR-0032: partition the Dart kernel
  library graph per declared units, drive stock backends (dart2js, DDC,
  gen_snapshot) with the resulting dills, and speak the frontend_server
  incremental protocol as the dev/live lane. Experimental; not published.
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter_mcp_harness: ^7.0.0
  meta: ^1.19.0
  oka_core: ^0.8.0
  oka_update: ^0.0.1

dev_dependencies:
  lints: ^6.1.0
  oka_web: ^0.8.0
  test: ^1.25.0
  yaml: ^3.1.2
