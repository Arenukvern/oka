# Workspace root — the packages ARE the release artifacts; the root itself is
# not published (the `oka` CLI lives in packages/oka). Tests that span
# packages (ADR conformance suites, real-pipeline evidence) live in test/ and
# run against the workspace members via dev_dependencies.
name: oka_workspace
description: >-
  Workspace root for the oka build system packages. Not published — see
  packages/oka for the CLI.
publish_to: none

workspace:
  - packages/*

environment:
  sdk: ^3.13.0

dev_dependencies:
  analyzer: ^14.0.0
  # Test fixtures exercise AAR/zip processing exported from oka_android;
  # the ADR conformance suites import oka_android/oka_core directly.
  archive: ^4.6.0
  args: ^2.5.0
  crypto: ^3.0.3
  lints: ^6.1.0
  oka: ^0.11.0 # x-release-please-version
  oka_android: ^0.11.0 # x-release-please-version
  oka_core: ^0.11.0 # x-release-please-version
  path: ^1.9.0
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
  yaml: ^3.1.2

# Local co-development with the sibling checkouts while is_dart_empty_or_not
# 0.6.0 / from_json_to_json 0.6.0 are unpublished; drop once both are on
# pub.dev.
dependency_overrides:
  from_json_to_json:
    path: ../from_json_to_json
  # intentcall_schema 1.x on pub still carries its deprecated jsonDecode*
  # stopgaps, which collide with from_json_to_json 0.6.0's real API; the
  # sibling checkout is the post-migration state (stopgaps removed).
  intentcall_schema:
    path: ../../mcp/cline/intentcall/packages/intentcall_schema
  is_dart_empty_or_not:
    path: ../is_dart_empty_or_not
