# Workspace root — the packages ARE the release artifacts; the root itself is
# not published (the `oka` CLI lives in packages/oka). Tests that span
# packages (ADR conformance suites, real-pipeline evidence) live in test/ and
# run against the workspace members via dev_dependencies.
name: oka_workspace
description: >-
  Workspace root for the oka build system packages. Not published — see
  packages/oka for the CLI.
publish_to: none

workspace:
  - packages/*

environment:
  sdk: ^3.12.0

dev_dependencies:
  # Test fixtures exercise AAR/zip processing exported from oka_android;
  # the ADR conformance suites import oka_android/oka_core directly.
  archive: ^4.0.9
  args: ^2.5.0
  lints: ^6.1.0
  oka: ^0.1.6
  oka_android: ^0.1.6
  oka_core: ^0.1.6
  path: ^1.9.0
  test: ^1.25.0
  xsoulspace_lints: ^0.1.2
  yaml: ^3.1.2
