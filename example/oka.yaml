name: example
version: 1.0.0+1

flutter:
  entrypoint: lib/main.dart
  assets:
    - assets/
  build_mode: debug
  target_platform: android-arm64
  tree_shake_icons: true
  enable_hot_reload: true
  # Additional Flutter build arguments
  build_args: []

android:
  compile_sdk: 34
  min_sdk: 21
  target_sdk: 34
  java_version: 11
  package_name: com.example.example
  version_code: 1
  version_name: 1.0.0+1
  source_dirs:
    - src/main/java
    - src/main/kotlin
  res_dirs:
    - src/main/res
  abis:
    - arm64-v8a
    - armeabi-v7a

# Cargo-apk specific configuration
cargo_apk:
  # Build targets (ABIs to build for)
  build_targets: ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
  # Application metadata
  application:
    label: "Example App"
    icon: "@mipmap/ic_launcher"
    theme: "@style/AppTheme"
    debuggable: false
    extract_native_libs: true
  # Activity configuration
  activity:
    label: "Example App"
    launch_mode: "singleTop"
    orientation: "portrait"
    exported: true
    config_changes: ["orientation", "keyboardHidden", "screenSize"]
  # Permissions
  permissions:
    - "android.permission.INTERNET"
    - "android.permission.ACCESS_NETWORK_STATE"
  # Features
  features:
    - name: "android.hardware.touchscreen"
      required: true
  # Custom manifest entries
  manifest_entries: {}

dependencies:
